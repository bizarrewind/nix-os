# =============================================================================
# Hyprlock — Apple macOS Lock Screen
# Tailored for 14-inch 1080p display @ 150% scaling (1280x720 logical viewport)
# =============================================================================

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 1
    no_fade_in = false
}

background {
    monitor =
    path = $HOME/.dotfiles/nixos/wallpapers/default.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.90
    brightness = 0.76
    vibrancy = 0.18
    vibrancy_darkness = 0.0
}

source = ~/.config/dynamic-colors/hyprlock.conf

# ── Top Minimal Lock Indicator ───────────────────────────────────────────────
label {
    monitor =
    text = 󰌾
    color = rgba(255, 255, 255, 0.45)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 270
    halign = center
    valign = center
}

# ── Apple-Style Single-Line Clock ────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M")"
    color = $text_color
    font_size = 84
    font_family = Noto Sans, JetBrainsMono Nerd Font Bold
    position = 0, 220
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.40)
}

# ── Date Subtitle (Clean Humanist Typography) ────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $date_color
    font_size = 22
    font_family = Noto Sans, JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.35)
}

# ── User Avatar Icon ─────────────────────────────────────────────────────────
label {
    monitor =
    text = 󰀉
    color = $accent_blue
    font_size = 32
    font_family = JetBrainsMono Nerd Font
    position = 0, 22
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.30)
}

# ── User Name ────────────────────────────────────────────────────────────────
label {
    monitor =
    text = Vexil
    color = $text_color
    font_size = 14
    font_family = Noto Sans, JetBrainsMono Nerd Font Bold
    position = 0, -14
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.35)
}

# ── Apple-Style Frosted Glass Password Capsule ──────────────────────────────
input-field {
    monitor =
    size = 240, 42
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.18)
    inner_color = rgba(18, 18, 24, 0.65)
    font_color = $text_color
    fade_on_empty = false
    placeholder_text = <span foreground="##8a8a9a" font_desc="Noto Sans 11">Enter Password</span>
    hide_input = false
    rounding = 21
    check_color = $check_color
    fail_color = $fail_color
    fail_text = <span font_desc="Noto Sans 10"><i>Incorrect Password ($ATTEMPTS)</i></span>
    fail_transition = 250
    capslock_color = $caps_color
    position = 0, -68
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.40)
}

# ── Bottom Battery & Status Bar ──────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:5000] echo "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1 || echo '')% 󰁹"
    color = rgba(255, 255, 255, 0.40)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 24
    halign = center
    valign = bottom
}
