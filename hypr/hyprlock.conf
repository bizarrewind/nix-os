# Material You Inspired Hyprlock Configuration
# Accent colors & typography adapted for modern Android/Pixel aesthetic

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    path = /home/vexil/Pictures/wallpapers/wallpaper1.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME (Stacked Hours and Minutes - Material You Style)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I")"
    color = rgba(240, 240, 255, 0.90)
    font_size = 110
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(190, 210, 255, 0.85)
    font_size = 110
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# DATE & DAY (Pill subtitle)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(220, 225, 240, 0.80)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 10
    halign = center
    valign = center
}

# USER GREETING PILL
label {
    monitor =
    text = 󰌾  Locked as $USER
    color = rgba(255, 255, 255, 0.65)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -45
    halign = center
    valign = center
}

# INPUT FIELD (Material You curved pill)
input-field {
    monitor =
    size = 280, 56
    outline_thickness = 2
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(25, 25, 35, 0.65)
    font_color = rgba(240, 240, 255, 0.9)
    fade_on_empty = false
    placeholder_text = <span foreground="##aaaaaa"><i>󰌈  Password...</i></span>
    hide_input = false
    rounding = 28 # Fully rounded pill
    check_color = rgba(160, 220, 160, 0.8)
    fail_color = rgba(255, 120, 120, 0.8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = rgba(255, 200, 100, 0.8)
    position = 0, -120
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# BATTERY & STATUS (Bottom widget)
label {
    monitor =
    text = cmd[update:5000] echo "$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo '')% 󰁹"
    color = rgba(220, 225, 240, 0.6)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = bottom
}
